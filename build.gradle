// Top-level build file where you can add configuration options common to all sub-projects/modules.

import java.text.SimpleDateFormat

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'  // or your current gradle plugin version
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24" // or your Kotlin version
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.matching { task ->
    task.name.matches('(.*generate.*Resources)|(.*map.*SourceSetPaths)')
}.all { task ->
    task.dependsOn copyRepoFiles
}

tasks.withType(Test).configureEach {
    testLogging {
        events("passed", "skipped", "failed", "standardOut", "standardError")
        showStandardStreams = true
    }
    reports {
        junitXml.required.set(true)
        html.required.set(true)
    }
}

final String[] ROOT_TO_RAW_COPYFILES = ["README.md", "CHANGELOG.md", "CONTRIBUTORS.md", "LICENSE.txt", "LICENSE.md", "LICENSE"]
task copyRepoFiles(type: Copy) {
    from rootProject.files(ROOT_TO_RAW_COPYFILES)
    into "app/src/main/res/raw"
    rename { String fileName -> fileName.toLowerCase() }
}

// Get all used Android language directories as an array for BuildConfig
@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
static String findUsedAndroidLocales() {
    Set<String> langs = new HashSet<>()
    new File('.').eachFileRecurse(groovy.io.FileType.DIRECTORIES) {
        final foldername = it.name
        if (foldername.contains('values-') &&
                !it.absolutePath.contains("build${File.separator}intermediates") &&
                !foldername.matches(".*values-((.*[0-9])|(land)|(port)).*")) {
            new File(it.toString()).eachFileRecurse(groovy.io.FileType.FILES) {
                if (it.exists() && it.name.toLowerCase().endsWith(".xml") && it.getText('UTF-8').contains("<string")) {
                    langs.add(foldername.replace("values-", ""))
                }
            }
        }
    }
    return '{' + langs.sort().collect { "\"${it}\"" }.join(",") + '}'
}

// Git revision hash and commit message for build metadata
ext.getGitHash = providers.exec {
    commandLine('git', 'rev-parse', 'HEAD')
}.standardOutput.asText.get().trim()

ext.getGitLastCommitMessage = providers.exec {
    commandLine('git', 'log', '--oneline', '-1', '--format="%s"')
}.standardOutput.asText.get().replace("\"", "").replace("\\", "").trim()

// Returns the build date in a RFC3339 compatible format (UTC)
@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
static String getBuildDate() {
    final SimpleDateFormat RFC3339_LIKE = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm'Z'")
    RFC3339_LIKE.setTimeZone(TimeZone.getTimeZone("UTC"))
    return RFC3339_LIKE.format(new Date())
}
